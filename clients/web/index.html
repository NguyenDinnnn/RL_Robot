<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ỨNG DỤNG HỌC TĂNG CƯỜNG TRONG VIỆC TỐI ƯU HÓA ĐƯỜNG ĐI CỦA ROBOT</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="main-container">

  <div class="row">
    <div class="card simulation-card">
      <div class="card-header">
        <span class="card-icon">🤖</span>
        <span class="card-title">Môi Trường Mô Phỏng</span>
        <span style="margin-left: auto; background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 10px; font-size: 12px;">Sẵn sàng</span>
      </div>
      
      <div class="grid-container">
        <div class="grid" id="grid"></div>
        
        <div class="legend">
          <div class="legend-item">
            <div class="legend-color robot">🤖</div>
            <span>Robot</span>
          </div>
          <div class="legend-item">
            <div class="legend-color goal"></div>
            <span>Mục tiêu</span>
          </div>
          <div class="legend-item">
            <div class="legend-color obstacle"></div>
            <span>Vật cản</span>
          </div>
          <div class="legend-item">
            <div class="legend-color waypoint"></div>
            <span>Điểm trung gian</span>
          </div>
        </div>
        
        <div id="msg" class="status-message">Môi trường đã được reset</div>
      </div>
    </div>

    <div class="card combined-control-card">
      <div class="combined-content">
        <div class="control-section">
          <div class="section-header">
            <span class="card-icon">🎮</span>
            <span class="card-title">Điều Khiển Robot</span>
          </div>
          
          <div class="button-group">
            <button class="btn btn-start" onclick="startAutoMove('random')">▶ Auto Move (Random)</button>
            <button class="btn btn-start" onclick="startAutoMove('greedy')">▶ Auto Move (Greedy)</button>
            <button class="btn btn-stop" onclick="stopAll()">🛑 Stop</button>
          </div>
                    
          <div class="button-group">
            <button class="btn btn-reset" onclick="resetGrid()">🔄 Reset</button>
            <button class="btn btn-debug" onclick="toggleDebug()">🔧 Debug</button>
          </div>
          
          <div id="manualControls" class="manual-controls" style="display:none;">
            <h4 style="text-align:center; margin-bottom:10px;">Điều khiển thủ công</h4>
            <div class="direction-buttons">
              <button class="btn btn-debug" onclick="manualMove('up')">↑</button>
              <button class="btn btn-debug" onclick="manualMove('right')">→</button>
              <button class="btn btn-debug" onclick="manualMove('down')">↓</button>
              <button class="btn btn-debug" onclick="manualMove('left')">←</button>
            </div>
          </div>
        </div>

        <div class="algorithm-section">
          <div class="section-header">
            <span class="card-icon">🧠</span>
            <span class="card-title">Thuật Toán Học Tăng Cường</span>
          </div>
          
          <div class="algorithm-buttons">
            <button class="btn-algorithm" onclick="runAlgorithm('MC')">Monte Carlo</button>
            <button class="btn-algorithm" onclick="runAlgorithm('Q-learning')">Q-Learning</button>
            <button class="btn-algorithm" onclick="runAlgorithm('SARSA')">SARSA</button>
            <button class="btn-algorithm" onclick="runAlgorithm('A2C')">A2C</button>
            
            <button class="btn-algorithm" onclick="runAlgorithm('PPO')">PPO</button>
            <button class="btn-algorithm" onclick="runAStar()">A*</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="card stats-card">
      <div class="card-header">
        <span class="card-icon">📈</span>
        <span class="card-title">Biểu đồ miền thể hiện hàm phần thưởng theo bước đi</span>
      </div>
      <canvas id="rewardChart" width="300" height="240"></canvas>
    </div>

    <div class="card stats-card">
      <div class="card-header">
        <span class="card-icon">📊</span>
        <span class="card-title">Thống Kê Hiệu Suất</span>
      </div>
      
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">THUẬT TOÁN</div>
          <div class="stat-value" id="current-algorithm">-</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">REWARD</div>
          <div class="stat-value" id="current-reward">-</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">STEP</div>
          <div class="stat-value" id="current-steps">-</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">WAYPOINTS</div>
          <div class="stat-value" id="current-waypoints">-</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">THỜI GIAN</div>
          <div class="stat-value" id="current-time">-</div>
        </div>
      </div>
      
      <div id="algoResult" class="algo-result" style="display:none;"></div>

      <canvas id="trajectory" width="300" height="240" style="border:1px solid #ccc; margin-top:10px;"></canvas>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="./site.js"></script>
</body>
</html>
